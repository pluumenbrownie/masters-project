[package]
name = "mcm-finder-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
annolog = { version = "0.1.0", path = "../annolog" }
bitvec = "1.0.1"
csv = "1.4.0"
cxx = "1.0.194"
dashmap = { version = "6.2.1", features = ["rayon"] }
fixedbitset = "0.5.7"
itertools = "0.15.0"
kdam = { version = "0.6.4", features = [
    "gradient",
    "rayon",
    "spinner",
    "unicode",
] }
miette = { version = "7.6.0", features = ["fancy"] }
num_enum = "0.7.6"
rand = { version = "0.10.1", features = [] }
rapidhash = "4.4.1"
rayon = "1.12.0"
rustc-hash = "2.1.2"
serde = { version = "1.0.229", features = ["derive"] }
statrs = { version = "0.19.1", features = ["rand"] }
thiserror = "2.0.18"

[build-dependencies]
cxx-build = "1.0.194"

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4.1"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"

[[bench]]
name = "dataset"
harness = false

[lints.rust]
refining_impl_trait = "allow"
unused_imports = "allow"
dead_code = "allow"
